[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-failure-learning"
version = "0.1.0"
description = "Paired interventions on cross-task failure reports in distributed agent teams"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "numpy>=1.24", "PyYAML>=6", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
remote = ["paramiko>=3", "pypdf>=5"]

[project.scripts]
teamlearn = "teamlearn.cli:main"

[tool.setuptools.packages.find]
include = ["teamlearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
