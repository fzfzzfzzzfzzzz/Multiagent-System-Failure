# Dedicated port for the core-confirmation service on 151 GPU 4-5.
default: qwen3_8b
models:
  mock:
    backend: mock
    model: mock-NOT-RESEARCH
  qwen3_8b:
    backend: openai_compatible
    base_url: http://127.0.0.1:18152/v1
    model: Qwen3-8B
    temperature: 0.2
    max_tokens: 512
    timeout: 120
    extra_body:
      chat_template_kwargs: {enable_thinking: false}
